<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoyagePH - Your Journey Starts Here</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <h1>VoyagePH</h1>
            </div>
            <div class = "tagline"> Your Journey Starts Here</div>
            <ul class="nav-links">
                <li><a >Destinations</a></li>
                <li><a >Tours</a></li>
                <li><a >Contact</a></li>
            </ul>
        </nav>
        </header>
    <main class = "container">
        <section id = step1 class ="card">
            <div class = "card-header">
                <span class = "badge">Step 1 of 2</span>
                <h2>Traveler Registration</h2>
            </div>
    <form id = "verification-form">
        <div class = "form-group">
            <label for = "fullname">Full Name</label>
            <input type = "text" id = "fullname" placeholder= "e.g. Sunde Valencia" required>
        </div>
        <div class = "form-group">
            <label for = "placeFrom">Place of Origin</label>
            <input type = "text" id = "placeFrom" placeholder= "e.g. Tokyo, Japan, New Zealand" required>
        </div>

        <div class = "form-group">
            <label for = "validId">Upload Valid ID(18+Verification)</label>
            <input type = "file" id = "validId" accept=".jpg,.jpeg,.png" required>
        </div>

        <button type = "submit" class = "btn btn-primary">Answer Questions</button>
    </form>
        </section>


    <section id = "step2" class = "card hidden">
        <div class = "card-header">
            <span class = "badge badge-accent">Step 2 of 2</span>
            <h2>Match Your Vacation</h2>
        </div>
        
        <form id = "question-form">
            <fieldset class = "quiz-group">
                <legend>1. Who travels with you?</legend>
                <input type ="radio" name="q1" value="solo" required><span>Solo Traveler </span>
                

            <button type = "submit" class = "btn btn-primary">Submit</button>
        </form>
    </main>

    
</body>
</html>
