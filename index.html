<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoyagePH - Your Journey Starts Here</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo" id="homeLogo">Voyage<span>PH</span></div>
    <nav class="nav-links">
      <button type="button" id="navHomeBtn" class="nav-btn">Home</button>
      <button type="button" id="navStartBtn" class="nav-btn nav-btn-accent">Plan Trip</button>
    </nav>
  </header>

  <main class="container">

    <!-- Home -->
    <section id="home" class="card hero-bg-card">
      <img src="Valencia-website-main/shutterstock_2248395735.webp" alt="Philippine travel view" class="hero-bg-img" onerror="this.style.display='none'" />
      <div class="hero-overlay">
        <span class="badge badge-gold">Explore the Philippines</span>
        <h1 class="hero-title">Discover Your Next Philippine Paradise</h1>
        <p class="hero-text">
          From coastal views and green hills to island escapes, find destinations matched to
          your travel style, budget, and comfort needs.
        </p>
        <button type="button" id="startTripBtn" class="btn btn-primary btn-large">
          Start Planning My Trip
        </button>
      </div>
    </section>

    

        </div>
      </form>
    </section>

    <!-- Step 3: Results -->
    <section id="results" class="card hidden">
      <div class="card-header">
        <span class="badge badge-gold">Top Recommendations</span>
        <h2 id="destinationTitle">Your Recommended Getaways</h2>
        <p id="welcomeMessage"></p>
      </div>

      <div id="resultsContent" class="destinations-grid"></div>

      <button type="button" id="restartBtn" class="btn btn-primary restart-btn">Back to Home</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
